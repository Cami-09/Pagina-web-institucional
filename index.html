<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Institucional - Uniciencia Clone</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header / Menú -->
    <header class="main-header">
        <div class="logo">Logo Institucional</div>
        <nav class="main-nav">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Académico</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner (Slider) -->
    <section class="banner-container" id="banner-slider">
        <div class="slide active"><img src="https://via.placeholder.com/1200x400/003366/ffffff?text=Banner+Institucional+1" alt="B1"></div>
        <div class="slide"><img src="https://via.placeholder.com/1200x400/d4af37/ffffff?text=Banner+Institucional+2" alt="B2"></div>
        <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="next" onclick="moveSlide(1)">&#10095;</button>
    </section>

    <!-- Contenido Principal (Editable vía CMS) -->
    <main class="content-area">
        <h1>Bienvenidos a la Institución</h1>
        <p>Este bloque representa el cuerpo de tu página, donde Joomla inyectará los artículos mediante la etiqueta &lt;jdoc:include type="component" /&gt; cuando realices la migración.</p>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
